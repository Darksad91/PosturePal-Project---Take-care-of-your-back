name: Build PosturePal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: posturepal/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust / Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: posturepal/src-tauri

      - name: Install frontend dependencies
        working-directory: posturepal
        run: npm ci

      - name: Build Tauri app
        working-directory: posturepal
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: posturepal-windows
          path: |
            posturepal/src-tauri/target/release/bundle/nsis/*.exe
            posturepal/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload macOS bundle
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: posturepal-macos
          path: |
            posturepal/src-tauri/target/release/bundle/dmg/*.dmg
            posturepal/src-tauri/target/release/bundle/macos/*.app
